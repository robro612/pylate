# Compression-aware training of GTE-ModernColBERT on RLHN hard negatives.
# First real run: quantize-only CAT (SHBQ-binary documents + int8 queries) -- all
# GPU, fast. Token pooling (kmeans/ward) is a follow-up; Ward in particular runs
# scipy linkage on CPU per document, so it is a throughput bottleneck at this scale.
run_name: cat-rlhn-gte-shbq
base_model: Alibaba-NLP/gte-modernbert-base
document_length: 300        # ModernBERT context is huge by default; cap for memory
query_length: 32
output_dir: output/cat-rlhn-gte-shbq

# Launch with `uv run --with wandb python examples/train/train.py --config ...`
# (wandb is injected at runtime, creds from ~/.netrc).
wandb:
  enabled: true
  project: pylate-cat

dataset: rlhn/rlhn-100K
num_negatives: 7
eval_fraction: 0.005        # tiny held-out slice for eval_loss
# Retrieval-quality eval (full-precision nDCG@10). Subset keeps each eval cheap.
evaluator: nanobeir
nanobeir_datasets: [nfcorpus, fiqa2018, scifact, scidocs, arguana]

compression:
  enabled: true
  lambda: 0.5
  query:
    quantizer:
      type: SHBQQuantizer
      inner: {type: CastQuantizer, dtype: int8}
  document:
    quantizer:
      type: SHBQQuantizer
      inner: {type: BinaryQuantizer}

training:
  num_train_epochs: 3
  # A100-80GB probe: B=64 fits at 61 GB, B=96 OOMs. 48 leaves headroom for eval /
  # longer batches; bump to 64 to maximize throughput. Effective batch = x num GPUs.
  per_device_train_batch_size: 48
  per_device_eval_batch_size: 32
  learning_rate: 5.0e-6
  warmup_ratio: 0.1
  bf16: true
  fp16: false
  eval_steps: 500
  logging_steps: 20
  save_steps: 5000
