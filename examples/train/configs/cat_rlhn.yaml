# Compression-aware training on RLHN hard-negative data.
# RLHN ships query + positive_passages + negative_passages (mined hard negatives);
# train.py auto-detects that schema and flattens it to query/positive/negative_1..k,
# so you only point `dataset` at it and set how many hard negatives to use.
run_name: cat-rlhn-shbq-ward
base_model: sentence-transformers/all-MiniLM-L6-v2
output_dir: output/cat-rlhn-shbq-ward
dataset: rlhn/rlhn-100K       # also: rlhn/rlhn-400K, rlhn/rlhn-680K (same schema)
# dataset_config omitted: RLHN has no named HF config.
num_negatives: 7             # hard negatives per query (+ in-batch negatives)
max_train_samples: 20000
eval_fraction: 0.01

compression:
  enabled: true
  lambda: 0.5
  query:
    quantizer:
      type: SHBQQuantizer
      inner: {type: CastQuantizer, dtype: int8}
  document:
    quantizer:
      type: SHBQQuantizer
      inner: {type: BinaryQuantizer}
    pooler:
      name: ward
      similarity_threshold: 0.7
      protected_tokens: 1

training:
  num_train_epochs: 1
  per_device_train_batch_size: 16
  learning_rate: 3.0e-6
  fp16: false
  bf16: false
  eval_steps: 100
  logging_steps: 10
