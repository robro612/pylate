defaults:
  - clustering: tac
  - _self_

type: tachiom
retrieval:
  - xtr
# Build params (official TachiomIndex interface)
center_dataset: true
total_centroids: null  # null = auto via auto_build_params
# clustering-specific params (n_iter, thresholds, etc.) live in conf/eval/index/clustering/
pq_sample_size: 4000000  # PQ codebook capacity is fixed (M*KSUB), so a constant sample suffices; 4M matches 10M quality at ~2.5x faster. Rust caps at min(this, n_tokens).
pq_n_iter: 10
pq_seed: 42
pq_subspaces: 32  # PQ subspaces (M). bits/dim = M/16; bytes/token = M. Must divide token_dim & be %4. Compiled: {4,8,16,32,64,128}. 32=2bit/dim (default), 64≈PLAID 4bit, 128=8bit (exceeds PLAID, 2x size).
normalize: true
hnsw_m: 32
ef_construction: 1500
# Search params
# Quality levers (see study below): k_docs_to_score is the dominant recall/coverage knob —
# it sets how many candidates reach full-MaxSim rerank (default 500 starved it). 2000 is a
# safe default; raise to 5000-10000 + alpha=null for recall-bound (deep-pool) datasets.
# alpha caps the candidate pool *after* k_docs (so alpha<1 and deep k_docs are in tension):
# alpha=0.45 is fine/faster at moderate k_docs; use alpha=null for max recall at deep k_docs.
# For ranking-precision-bound (shallow-pool) datasets the lever is pq_subspaces (M), not search.
k_centroids: 20
k_docs_to_score: 2000  # was 500 (reranker-starved). 2000 recovers most recall; 5000-10000+alpha=null for deep-pool sets.
ef_search: null  # null = auto (1.5 * k_centroids)
alpha: 0.45      # candidate-pool prune width; set null for max recall with deep k_docs_to_score
beta: null
lambda_: null
# XTR-style imputation of missing per-token coarse scores. When false (default),
# a doc absent from all probed centroids for a query token scores 0 on that token.
# When true, each hit is credited best_sim - m_i (m_i = min retrieved centroid sim),
# which is rank-equivalent to imputing missing contributions with m_i (an upper bound).
# NOTE: impute_missing=true with alpha-pruning REQUIRES gap_relative=true (below) —
# imputation adds a per-query constant the magnitude band isn't invariant to. Empirically
# a clean win for non-XTR-trained models (LateOn: +0.022 NDCG / +0.050 R@100 on lotte);
# a no-op for XTR-trained models (ModernBERT-XTR), which already internalize it.
impute_missing: false
# Gap-relative (shift-invariant) alpha pruning: threshold = s_k - alpha*(s_best - s_k)
# instead of the magnitude band s_k - |s_k|*alpha. Mandatory when impute_missing=true and
# alpha is set (TachiomIndex raises otherwise); harmless/usable on its own.
gap_relative: false
num_threads: 0
