defaults:
  - dataset: kd_msmarco_gemma
  - loss: kd_xtr
  - override hydra/job_logging: stdout
  - _self_

hydra:
  job:
    chdir: false

model_name: null
query_length: 32
document_length: 512
query_prefix: ""
document_prefix: ""

query_token_weight_head:
  enabled: false
  hidden_dims: []            # [] => single Dense projection to scalar
  hidden_activation: "gelu"  # relu, gelu, tanh, identity
  use_residual: false
  bias: true
  normalization_mode: "mean1"  # none, sum1, mean1 (mean1 keeps baseline-like score scale)
  positive_activation: "softplus"  # softplus, relu, exp, identity

batch_size: 16
gradient_accumulation_steps: 1
max_steps: 20000
num_epochs: null        # alternative to max_steps; set one or the other
learning_rate: 4e-6
warmup_steps: 0
eval_on_start: true
eval_steps: 500
save_steps: 1000
save_total_limit: 1
logging_steps: 10
dtype: fp16             # fp16, bf16, or fp32
compile: true           # torch.compile via HF TrainingArguments

run_name: null          # auto-generated if null
output_dir: null        # defaults to output/{run_name}

wandb:
  project: "xtr"
  group: "distillation"
