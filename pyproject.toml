[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pylate"
dynamic = ["version"]
description = "A library for training and retrieval with ColBERT."
readme = "README.md"
authors = [{ name = "LightOn" }]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "sentence-transformers == 5.5.1",
    "datasets >= 2.20.0",
    "accelerate >= 0.31.0",
    "pandas >= 2.2.1",
    "transformers >= 4.41.0, <= 5.3.0",
    "ujson == 5.12.0",
    "ninja == 1.11.1.4",
    "fastkmeans == 0.5.0",
    # Upper bound relaxed from 1.4.7.2110 so the local profiling build (upstream
    # 1.6.0 + stage-profile) satisfies it; see [tool.uv.sources] below. 1.6.0
    # changes search chunking/device placement, so re-baseline fastplaid timings.
    "fast-plaid>=1.4.7",
]
keywords = []

[tool.setuptools.dynamic]
version = { attr = "pylate.__version__" }

[project.urls]
Homepage = "https://github.com/lightonai/pylate.git"
Documentation = "https://lightonai.github.io/pylate/"

[project.optional-dependencies]
dev = [
    "ruff >= 0.4.9",
    "pytest-cov >= 5.0.0",
    "pytest-xdist >=3.6.0",
    "pytest-rerunfailures >= 15.0.0",
    "pytest >= 8.2.1",
    "pandas >= 2.2.1",
    "einops>=0.8.1",
    "pre-commit>=4.1.0",
    "ranx >= 0.3.16",
    "beir >= 2.0.0",
    "fastapi >= 0.114.1",
    "uvicorn >= 0.30.6",
    "batched >= 0.1.2",
    "voyager >= 2.0.9; python_version < '3.14'",
    "typos >= 0.11.0",
]
eval = ["ranx >= 0.3.16", "beir >= 2.0.0", "hydra-core >= 1.3.2", "ir-datasets >= 0.5.0"]
api = ["fastapi >= 0.114.1", "uvicorn >= 0.30.6", "batched >= 0.1.2"]
voyager = ["voyager >= 2.0.9; python_version < '3.14'"]
scann = ["scann >= 1.4.2; python_version < '3.14'"]
warp = ["xtr-warp-rs == 2.0.3.*"]
tachiom = ["tachiom >=0.3.3,<0.4.0"]
# Chimera is cu130-only, and not by convention: compute_full_bit_scores uses
# AVX-512 intrinsics unconditionally, and the V100 nodes that take cu126 are
# Broadwell Xeons without it. It also needs cuVS, which only the cu130/cu126
# extras pull in. scripts/sync_env.sh enables this extra for cu130* targets.
#
# scikit-build-core and pybind11 are listed here rather than left to PEP 517
# because the extension is built with build isolation OFF (see [tool.uv]
# no-build-isolation-package) — they have to be present in the environment
# already when it builds.
chimera = [
    "chimera-retrieval",
    "scikit-build-core >= 0.10",
    "pybind11 >= 2.12",
]
flash-maxsim = ["flash-maxsim >= 0.2.1"]
lik = [
    "late-interaction-kernels >=0.4.0,<0.5.0",
]
image = ["sentence-transformers[image]", "peft >= 0.13.0"]
# ── CUDA variants ────────────────────────────────────────────────────────────
# Mutually exclusive (see `conflicts` in [tool.uv]); pick one per environment:
#
#   cu130  L40S / A100 / H100 — torch 2.11.0 from PyPI, which ships CUDA 13
#   cu126  V100              — torch 2.11.0 from the cu126 index; CUDA 13
#                              dropped Volta sm_70, CUDA 12.6 still has it
#
# Same torch *version* either way, so the Rust forks (fast-plaid, tachiom) link
# the same libtorch API on both node types and their instrumentation is
# comparable. Only the bundled CUDA runtime differs.
#
# `cuvs-*` powers GPU clustering (scripts/gpu_cluster.py backend=cagra/brute).
# Its pypi.nvidia.com entries carry no upload date, so any `exclude-newer`
# cutoff filters out every compatible wheel — the global uv.toml has that
# setting disabled for this project; use per-command `--exclude-newer` instead
# of turning it back on.
cu130 = [
    "torch == 2.11.0",
    "cuvs-cu13 >= 25.10; sys_platform == 'linux' and python_version < '3.14'",
]
cu126 = [
    "torch == 2.11.0",
    "cuvs-cu12 >= 25.10; sys_platform == 'linux' and python_version < '3.14'",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# To use a local tachiom build instead of PyPI, point this at your checkout.
# Comment out to fall back to the version constraint above.
tachiom = { path = "../tachiom", editable = true }
# Local fast-plaid checkout — required for Rust stage profiling, since the PyPI
# wheel exports no begin_profile/take_profile and the index silently skips it.
#
# NOT editable, deliberately. A maturin editable install is a .pth pointing at
# `../fast-plaid/python`, so every environment would share the one compiled .so
# sitting in the source tree — the last build would win, and a cu126 venv would
# import an extension linked against cu130 libtorch. A regular install puts a
# per-environment .so in site-packages, which is what makes .venv-cu126 /
# .venv-cu130 / .venv-profile independent. The cost is that Rust edits need a
# re-sync (or a `maturin develop` into a specific venv) rather than being picked
# up live — which a compiled extension requires anyway.
fast-plaid = { path = "../fast-plaid", editable = false }
# Local Chimera checkout, carrying the packaging commit that gives it a
# pyproject.toml (upstream has none — it is a bare CMake project). Non-editable
# for the same reason as fast-plaid, and more strictly: the compiled module
# RPATHs the RAPIDS wheels in *this* environment's site-packages and is built
# with -march=native, so it is specific to both the venv and the node class.
chimera-retrieval = { path = "../Chimera", editable = false }
cuvs-cu13 = { index = "nvidia" }
cuvs-cu12 = { index = "nvidia" }
# Only the cu126 extra redirects torch; cu130 takes the PyPI wheel, which is
# already a CUDA 13 build.
torch = [{ index = "pytorch-cu126", extra = "cu126" }]

[tool.uv]
# Groups, unlike extras, can be enabled by default — which is the whole point:
# a bare `uv run` re-syncs, and anything not in the default set gets *pruned*.
# Keeping the working set in a default group means `uv run` stops uninstalling
# tachiom / hydra / ranx behind your back. The extras stay as the published
# install surface for people who `pip install pylate[eval]`.
default-groups = ["research", "docs"]
# Chimera resolves cuVS/RAFT/RMM out of the *target* environment's site-packages
# and bakes those paths into the module's RPATH. An isolated build environment is
# discarded after the build, so an RPATH into it would dangle — the build has to
# see the environment it is being installed into.
no-build-isolation-package = ["chimera-retrieval"]
# One environment cannot hold both CUDA variants.
conflicts = [[{ extra = "cu126" }, { extra = "cu130" }]]


[dependency-groups]
# The everyday research working set, enabled by default (see [tool.uv]). Mirrors
# the extras rather than duplicating their contents, so the published extras stay
# the single source of truth for what each one pulls in.
research = [
    "pylate[dev,eval,api,scann,voyager,tachiom]",
    # For rebuilding the Rust forks in place (`maturin develop --features ...`)
    # without a separate tool install.
    "maturin >= 1.8.6",
]
docs = [
    "mkdocs-material == 9.5.32",
    "mkdocs-awesome-pages-plugin == 2.9.3",
    "mkdocs-jupyter == 0.24.8",
    "mkdocs_charts_plugin == 0.0.10",
    "numpydoc == 1.8.0",
    "Pillow",
]

[tool.setuptools]
packages = ["pylate"]

[tool.setuptools.package-data]
pylate = ["hf_hub/model_card_template.md", "py.typed"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D417"]
ignore = ["ANN"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::UserWarning",
]
addopts = "--doctest-modules --verbose -ra --cov-config=.coveragerc -m \"not web and not slow\""
doctest_optionflags = "NORMALIZE_WHITESPACE NUMBER"
norecursedirs = ["build", "docs", "node_modules", "pylate/server"]
markers = [
    "model_loading: marks tests that download large models",
    "slow: long-running tests (CUDA parity, training smokes) — opt in with `-m slow`",
]

[tool.typos.default]
binary = false
locale = "en"
extend-ignore-words-re = [
    "arange",
    "(?i)^lik$",
    "thw",
]
extend-ignore-re = [
    "xlm-mlm-ende-1024",
    "xlm-clm-ende-1024",
    "compute_metrices",
]
